[project]
name = "yuksalish-edu-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
description = "Yuksalish Edu o‘quv markazi platformasi"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
