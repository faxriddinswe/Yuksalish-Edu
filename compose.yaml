name: yuksalish-edu
x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
    - static:/app/staticfiles
    - exports:/app/private_exports
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuksalish}
      POSTGRES_USER: ${POSTGRES_USER:-yuksalish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?scripts/init-env orqali .env yarating}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    <<: *backend
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: development
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/kirish').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10
    depends_on:
      backend: {condition: service_healthy}
  celery-worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --concurrency=2 --hostname=worker@%h
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping -d worker@$${HOSTNAME} --timeout=5']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  celery-beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  nginx:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./infrastructure/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      frontend: {condition: service_healthy}
volumes:
  postgres:
  redis:
  media:
  static:
  exports:
