          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      phone:
                        type: string
                      full_name:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
                      extra_permissions:
                        type: array
                        items:
                          type: string
                      is_active:
                        type: boolean
                    nullable: true
          description: ''
    post:
