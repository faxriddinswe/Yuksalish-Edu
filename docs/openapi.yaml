components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 180
        title:
          type: string
          maxLength: 200
        description:
          type: string
        score:
          type: string
          maxLength: 60
        is_sample:
          type: boolean
        student:
          type: integer
          nullable: true
        subject:
          type: integer
        teacher:
          type: integer
          nullable: true
        achieved_on:
          type: string
          format: date
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        consent_record:
          type: string
        privacy_reviewed:
          type: boolean
        publication_status:
          $ref: '#/components/schemas/PublicationStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        subject_name:
          type: string
          readOnly: true
        teacher_name:
          type: string
          readOnly: true
          default: ''
        student_name:
          type: string
          readOnly: true
          default: ''
      required:
      - created_at
      - description
      - display_name
      - id
      - student_name
      - subject
      - subject_name
      - teacher_name
      - title
      - updated_at
    ActivationRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          default: ACTIVATE
      required:
      - code
      - password
      - phone
    AdjustInvoiceRequest:
