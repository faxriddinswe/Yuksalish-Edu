openapi: 3.0.3
info:
  title: Yuksalish Edu API
  version: 1.0.0
  description: O‘quv markazi ichki boshqaruv API
paths:
  /api/v1/attendance/:
    get:
      operationId: attendance_list
      parameters:
      - in: query
        name: lesson
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABSENT
          - EXCUSED
          - LATE
          - PRESENT
        description: |-
          * `PRESENT` - Qatnashgan
          * `ABSENT` - Qatnashmagan
          * `LATE` - Kechikkan
          * `EXCUSED` - Sababli
      - in: query
        name: student
        schema:
          type: integer
      tags:
      - attendance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
    post:
      operationId: attendance_create
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceWrite'
          description: ''
  /api/v1/attendance/{id}/:
    get:
      operationId: attendance_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attendance.
